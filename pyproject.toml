[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chess-knowledge-coach"
version = "0.1.0"
description = "Local-first chess skill evidence and adaptive coaching foundations"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "berserk>=0.14",
  "chess>=1.11",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "sqlalchemy>=2.0",
  "fsrs>=5.0",
]

[project.scripts]
chess-coach = "chess_coach.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
