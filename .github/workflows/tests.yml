name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12.13"
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12.13"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --dev
      - name: Install JavaScript quality tools
        run: npm ci --ignore-scripts
      - name: Limit collected test cases
        run: |
          output=$(uv run pytest --collect-only -o addopts= -q)
          count=$(printf '%s\n' "$output" | sed -nE 's/^([0-9]+) tests? collected.*/\1/p')
          echo "Collected cases: $count"
          test -n "$count" && test "$count" -le 200
      - name: Run pytest and report coverage
        timeout-minutes: 15
        run: |
          uv run python -c 'import sqlite3, sys; assert sys.version_info[:3] == (3, 12, 13), sys.version; print("Python:", sys.version); print("SQLite:", sqlite3.sqlite_version); print("SQLite source:", sqlite3.connect(":memory:").execute("SELECT sqlite_source_id()").fetchone()[0])'
          uv run pytest -vv --cov --cov-report=term-missing --cov-precision=2
          uv run coverage json -o - | uv run python -c 'import json, sys; total = json.load(sys.stdin)["totals"]["percent_covered"]; print(f"Unrounded coverage: {total:.6f}%")'
