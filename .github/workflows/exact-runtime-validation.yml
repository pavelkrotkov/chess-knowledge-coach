name: Exact runtime validation

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - name: Validate commit input
        id: target
        env:
          TARGET_SHA: ${{ inputs.commit }}
        run: |
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "Expected a lowercase 40-character commit SHA"; exit 1; }
          echo "sha=$TARGET_SHA" >> "$GITHUB_OUTPUT"
      - name: Checkout exact commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
      - name: Verify source and prerequisites
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "Commit: $(git rev-parse HEAD)"
          echo "Tree: $(git rev-parse 'HEAD^{tree}')"
          if ! test -f package-lock.json || ! test -f scripts/js-quality.cjs; then
            echo "Target requires package-lock.json and scripts/js-quality.cjs"
            exit 1
          fi
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.6"
          enable-cache: false
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.23.2"
      - name: Install and verify exact Python
        run: |
          test "$(uv --version | cut -d " " -f 1-2)" = "uv 0.12.6"
          test "$(node --version)" = "v22.23.2"
          curl --fail --location --silent --show-error 'https://github.com/astral-sh/python-build-standalone/releases/download/20260728/cpython-3.12.13%2B20260728-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz' -o "$RUNNER_TEMP/python.tar.gz"
          echo "7ceaf4360f4b4ab44f31d8217cfdc70df8e12b61d9561b4900ee7af87176e50d  $RUNNER_TEMP/python.tar.gz" | sha256sum --check
          mkdir "$RUNNER_TEMP/exact-python"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$RUNNER_TEMP/exact-python"
          python="$RUNNER_TEMP/exact-python/python/bin/python3.12"
          echo "1e4461092175d186c4bcdb19ee2849a45d6e4d8d1f6a871e45f63418d52a4e35  $python" | sha256sum --check
          test "$("$python" --version)" = "Python 3.12.13"
          uv sync --frozen --python "$python"
          echo "UV_PYTHON=$python" >> "$GITHUB_ENV"
          uv run --frozen --no-sync --python "$python" python -c 'import hashlib, pathlib, sys, chess_coach; p = pathlib.Path(sys.executable).resolve(); assert sys.version_info[:3] == (3, 12, 13); assert hashlib.sha256(p.read_bytes()).hexdigest() == "1e4461092175d186c4bcdb19ee2849a45d6e4d8d1f6a871e45f63418d52a4e35"; assert pathlib.Path(chess_coach.__file__).resolve().is_relative_to(pathlib.Path.cwd() / "src"); print("Verified Python:", p, sys.version)'
      - name: Install and identify Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y stockfish
          dpkg-query -W stockfish
          test -x /usr/games/stockfish
          sha256sum /usr/games/stockfish
          printf 'quit\n' | /usr/games/stockfish
          echo /usr/games >> "$GITHUB_PATH"
      - name: Install locked JavaScript dependencies and check quality
        run: |
          npm ci --ignore-scripts
          node scripts/js-quality.cjs
      - name: Limit collected test cases
        run: |
          output=$(uv run --frozen --no-sync pytest --collect-only -o addopts= -q)
          count=$(printf '%s\n' "$output" | sed -nE 's/^([0-9]+) tests? collected.*/\1/p')
          echo "Collected cases: $count"
          test -n "$count" && test "$count" -le 200
      - name: Run full suite and report raw coverage
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          uv run --frozen --no-sync pytest -ra --junitxml="$RUNNER_TEMP/pytest-results.xml" --cov --cov-report=term-missing --cov-precision=2
          uv run --frozen --no-sync python - "$RUNNER_TEMP/pytest-results.xml" <<'PYTEST_CHECK'
          import collections, sys, xml.etree.ElementTree as ET
          expected = {
              "test_real_stockfish_deep_smoke": 1,
              "test_actual_stockfish_bounded_smoke": 1,
              "test_real_engine_pipeline_mate_inspection": 1,
              "test_real_stockfish_bounded_worker_records_nonmate_observation": 1,
              "test_stockfish_smoke_with_explicit_resource_limits": 1,
          }
          counts = collections.Counter()
          for case in ET.parse(sys.argv[1]).iter("testcase"):
              name = case.get("name", "").split("[", 1)[0]
              skipped = case.find("skipped")
              if name in expected:
                  if skipped is not None:
                      sys.exit(f"Native engine case skipped: {name}")
                  counts[name] += 1
              if skipped is not None and "stockfish" in ET.tostring(skipped, encoding="unicode").lower():
                  sys.exit(f"Stockfish case skipped: {name}")
          if counts != expected:
              sys.exit(f"Native engine case counts differ: {dict(counts)}")
          print(f"Native engine cases passed: {sum(counts.values())}")
          PYTEST_CHECK
          uv run --frozen --no-sync coverage json -o - | uv run --frozen --no-sync python -c 'import json, sys; t = json.load(sys.stdin)["totals"]; covered = t["covered_lines"] + t["covered_branches"]; total = t["num_statements"] + t["num_branches"]; print(f"Raw coverage: {covered}/{total} ({100 * covered / total:.6f}%)" if total else "Empty coverage"); sys.exit(not total)'
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain --untracked-files=no)"
