name: Python Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install dependencies
        run: uv sync --dev
      - name: Install JavaScript quality tools
        run: npm ci --ignore-scripts
      - name: Run Ruff check
        run: uv run ruff check --output-format=github .
      - name: Run Ruff format check
        run: uv run ruff format --check .
      - name: Run ty type check
        run: uv run ty check
      - name: Enforce quality metrics
        run: uv run python -m scripts.quality --check
      - name: Enforce JavaScript quality metrics
        run: node scripts/js-quality.cjs
